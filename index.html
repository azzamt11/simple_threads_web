<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yolks</title>
    <style>
        :root {
            --bg-color: #101010;
            --card-bg: #181818;
            --card-bg-subtle: #202020;
            --text-main: #f3f5f7;
            --text-muted: #777777;
            --border-color: #2a2a2a;
            --accent: #ffffff;
            --heart-active: #f91880;
            --danger: #ff453a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px;
        }

        .container {
            width: 100%;
            max-width: 620px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 1.8rem;
            letter-spacing: -0.5px;
        }

        .auth-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 13px;
        }

        /* Card & Forms */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .form-row {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }

        textarea {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 15px;
            resize: none;
            outline: none;
            margin-bottom: 12px;
            font-family: inherit;
        }

        input {
            background: var(--card-bg-subtle);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
            outline: none;
            width: 100%;
        }

        input:focus { border-color: #555; }

        .compose-footer {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 10px;
        }

        button {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 6px 16px;
            border-radius: 100px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: opacity 0.15s ease;
        }

        button:hover { opacity: 0.85; }

        button.btn-outline {
            background: transparent;
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }

        button.btn-outline:hover {
            background: var(--card-bg-subtle);
        }

        /* Feed & Post Styles */
        .thread-item {
            background: var(--bg-color);
            border-bottom: 1px solid var(--border-color);
            padding: 16px 0;
            display: flex;
            flex-direction: column;
        }

        .thread-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .author { color: var(--text-main); }
        .actions-menu { display: flex; gap: 12px; }

        .action-text-btn {
            background: none;
            color: var(--text-muted);
            font-size: 12px;
            cursor: pointer;
            padding: 0;
            border-radius: 0;
            font-weight: 500;
        }
        .action-text-btn:hover { color: var(--text-main); }

        .thread-content {
            font-size: 15px;
            line-height: 1.45;
            margin-bottom: 12px;
            color: #e5e5e5;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .thread-footer {
            display: flex;
            align-items: center;
            gap: 16px;
            color: var(--text-muted);
            font-size: 13px;
        }

        .icon-btn {
            background: none;
            color: var(--text-muted);
            cursor: pointer;
            font-weight: 500;
            padding: 0;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 13px;
        }

        .icon-btn.liked { color: var(--heart-active); }
        .icon-btn:hover { color: var(--text-main); }
        .icon-btn.liked:hover { color: var(--heart-active); }

        /* Comments Styling */
        .comments-section {
            margin-top: 14px;
            padding-left: 14px;
            border-left: 2px solid var(--border-color);
            display: none;
        }

        .comments-section.open {
            display: block;
        }

        .comment-item {
            padding: 10px 0;
            border-bottom: 1px solid #1f1f1f;
        }

        .comment-item:last-child {
            border-bottom: none;
        }

        .comment-compose {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .comment-compose input {
            font-size: 13px;
            padding: 6px 12px;
        }

        .auth-switch-link {
            color: #2997ff;
            cursor: pointer;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Yolks</h1>
            <div id="authNav" class="auth-bar"></div>
        </header>

        <!-- Auth Panel (Shown when logged out) -->
        <div id="authSection" class="card" style="display:none;">
            <h3 id="authTitle" style="margin-bottom: 12px; font-size: 16px;">Log in</h3>
            <div id="registerFields" class="form-row" style="display:none;">
                <input type="text" id="authName" placeholder="Full Name">
            </div>
            <div class="form-row">
                <input type="email" id="authEmail" placeholder="Email">
                <input type="password" id="authPassword" placeholder="Password">
            </div>
            <div class="compose-footer" style="justify-content: space-between;">
                <span style="font-size: 12px; color: var(--text-muted);">
                    <span id="authSwitchPrompt">Need an account?</span> 
                    <span class="auth-switch-link" onclick="toggleAuthMode()" id="authSwitchBtn">Register</span>
                </span>
                <button onclick="handleAuthSubmit()" id="authSubmitBtn">Log In</button>
            </div>
        </div>

        <!-- Create Thread Box (Shown when logged in) -->
        <div id="composeSection" class="card" style="display:none;">
            <textarea id="postContent" placeholder="Start a thread..." rows="3"></textarea>
            <div class="compose-footer">
                <button onclick="createPost()">Post</button>
            </div>
        </div>

        <!-- Feed List -->
        <div id="feed"></div>
    </div>

    <script>
        const API_BASE = "https://threads-api.aazzam.my.id";

        let currentUser = null;
        let token = localStorage.getItem("token") || null;
        let isRegisterMode = false;

        document.addEventListener("DOMContentLoaded", () => {
            initAuth();
            fetchPosts();
        });

        // ---------------- AUTHENTICATION ----------------

        function initAuth() {
            const storedUser = localStorage.getItem("user");
            if (token && storedUser) {
                try {
                    currentUser = JSON.parse(storedUser);
                } catch {
                    logout();
                    return;
                }
            }
            renderAuthUI();
        }

        function renderAuthUI() {
            const authNav = document.getElementById("authNav");
            const authSection = document.getElementById("authSection");
            const composeSection = document.getElementById("composeSection");

            if (currentUser && token) {
                authSection.style.display = "none";
                composeSection.style.display = "block";
                authNav.innerHTML = `
                    <span>@${currentUser.name || 'user_' + currentUser.id}</span>
                    <button class="btn-outline" onclick="logout()">Log out</button>
                `;
            } else {
                authSection.style.display = "block";
                composeSection.style.display = "none";
                authNav.innerHTML = `<span style="color:var(--text-muted)">Guest Mode</span>`;
            }
        }

        function toggleAuthMode() {
            isRegisterMode = !isRegisterMode;
            document.getElementById("authTitle").innerText = isRegisterMode ? "Create Account" : "Log In";
            document.getElementById("registerFields").style.display = isRegisterMode ? "flex" : "none";
            document.getElementById("authSubmitBtn").innerText = isRegisterMode ? "Sign Up" : "Log In";
            document.getElementById("authSwitchPrompt").innerText = isRegisterMode ? "Already registered?" : "Need an account?";
            document.getElementById("authSwitchBtn").innerText = isRegisterMode ? "Log In" : "Register";
        }

        async function handleAuthSubmit() {
            const email = document.getElementById("authEmail").value.trim();
            const password = document.getElementById("authPassword").value.trim();
            const name = document.getElementById("authName").value.trim();

            if (!email || !password || (isRegisterMode && !name)) {
                return alert("Please fill in all required credentials.");
            }

            const endpoint = isRegisterMode ? `${API_BASE}/register` : `${API_BASE}/login`;
            const payload = isRegisterMode ? { name, email, password } : { email, password };

            try {
                const res = await fetch(endpoint, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                if (!res.ok) {
                    const errMsg = await res.text();
                    return alert(`Auth error: ${errMsg}`);
                }

                const data = await res.json();
                token = data.token;
                currentUser = data.user;

                localStorage.setItem("token", token);
                localStorage.setItem("user", JSON.stringify(currentUser));

                document.getElementById("authEmail").value = "";
                document.getElementById("authPassword").value = "";
                document.getElementById("authName").value = "";

                renderAuthUI();
                fetchPosts();
            } catch (err) {
                console.error("Authentication failed:", err);
                alert("Connection failed. Check API service.");
            }
        }

        function logout() {
            token = null;
            currentUser = null;
            localStorage.removeItem("token");
            localStorage.removeItem("user");
            renderAuthUI();
            fetchPosts();
        }

        function getAuthHeaders() {
            const headers = { "Content-Type": "application/json" };
            if (token) {
                headers["Authorization"] = `Bearer ${token}`;
            }
            return headers;
        }

        // ---------------- POSTS (ROOT THREADS) ----------------

        async function fetchPosts() {
            try {
                const response = await fetch(`${API_BASE}/posts`, {
                    headers: getAuthHeaders()
                });
                const posts = await response.json();
                const feed = document.getElementById('feed');
                feed.innerHTML = '';

                if (!posts || posts.length === 0) {
                    feed.innerHTML = `<p style="text-align:center;color:var(--text-muted);margin-top:28px;">No threads yet.</p>`;
                    return;
                }

                posts.forEach(post => {
                    const isAuthor = currentUser && currentUser.id === post.user_id;
                    const escapedContent = escapeHtml(post.content);
                    const rawContentEscapedForAttr = post.content.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;');

                    const item = document.createElement('div');
                    item.className = 'thread-item';
                    item.id = `post-${post.id}`;
                    item.innerHTML = `
                        <div class="thread-header">
                            <span class="author">@${escapeHtml(post.user_name || 'user_' + post.user_id)}</span>
                            ${isAuthor ? `
                                <div class="actions-menu">
                                    <button class="action-text-btn" onclick="editPost(${post.id}, '${rawContentEscapedForAttr}')">Edit</button>
                                    <button class="action-text-btn" style="color:var(--danger);" onclick="deletePost(${post.id})">Delete</button>
                                </div>
                            ` : ''}
                        </div>
                        <div class="thread-content">${escapedContent}</div>
                        <div class="thread-footer">
                            <button class="icon-btn ${post.is_liked ? 'liked' : ''}" onclick="toggleLike(${post.id}, ${post.is_liked})">
                                ${post.is_liked ? '❤️' : '🤍'} <span>${post.like_count || 0}</span>
                            </button>
                            <button class="icon-btn" onclick="toggleCommentsSection(${post.id})">
                                💬 <span>Replies</span>
                            </button>
                        </div>
                        
                        <!-- Replies Container -->
                        <div class="comments-section" id="comments-${post.id}">
                            <div class="comments-list" id="comments-list-${post.id}">
                                <div style="font-size:12px; color:var(--text-muted);">Loading replies...</div>
                            </div>
                            ${currentUser ? `
                                <div class="comment-compose">
                                    <input type="text" id="comment-input-${post.id}" placeholder="Reply to thread..." onkeydown="if(event.key==='Enter') createComment(${post.id})">
                                    <button onclick="createComment(${post.id})">Reply</button>
                                </div>
                            ` : `<div style="font-size:12px; color:var(--text-muted); margin-top:8px;">Log in to leave a reply.</div>`}
                        </div>
                    `;
                    feed.appendChild(item);
                });
            } catch (err) {
                console.error("Error fetching posts:", err);
            }
        }

        async function createPost() {
            if (!token) return alert("Please log in to post.");
            const textarea = document.getElementById('postContent');
            const content = textarea.value.trim();

            if (!content) return alert("Post content cannot be empty.");

            try {
                const res = await fetch(`${API_BASE}/posts`, {
                    method: 'POST',
                    headers: getAuthHeaders(),
                    body: JSON.stringify({ content: content, parent_post_id: null })
                });

                if (!res.ok) throw new Error(await res.text());

                textarea.value = '';
                fetchPosts();
            } catch (err) {
                console.error("Error creating post:", err);
                alert("Failed to create post: " + err.message);
            }
        }

        async function editPost(id, currentContent) {
            if (!token) return alert("Please log in to edit.");
            const newContent = prompt("Update your thread:", currentContent);
            if (newContent === null || !newContent.trim()) return;

            try {
                const res = await fetch(`${API_BASE}/posts`, {
                    method: 'PUT',
                    headers: getAuthHeaders(),
                    body: JSON.stringify({ id: id, content: newContent.trim() })
                });

                if (!res.ok) throw new Error(await res.text());
                fetchPosts();
            } catch (err) {
                console.error("Error updating post:", err);
                alert("Failed to update post: " + err.message);
            }
        }

        async function deletePost(id, parentId = null) {
            if (!token) return alert("Please log in to delete.");
            if (!confirm("Are you sure you want to delete this?")) return;

            try {
                const res = await fetch(`${API_BASE}/posts/delete?id=${id}`, {
                    method: 'DELETE',
                    headers: getAuthHeaders()
                });

                if (!res.ok) throw new Error(await res.text());

                if (parentId) {
                    loadComments(parentId);
                } else {
                    fetchPosts();
                }
            } catch (err) {
                console.error("Error deleting post:", err);
                alert("Failed to delete: " + err.message);
            }
        }

        // ---------------- LIKES ----------------

        async function toggleLike(postId, currentlyLiked, parentId = null) {
            if (!token) return alert("Please log in to like posts.");

            try {
                if (currentlyLiked) {
                    await fetch(`${API_BASE}/likes/delete?post_id=${postId}`, {
                        method: 'DELETE',
                        headers: getAuthHeaders()
                    });
                } else {
                    await fetch(`${API_BASE}/likes`, {
                        method: 'POST',
                        headers: getAuthHeaders(),
                        body: JSON.stringify({ post_id: postId })
                    });
                }

                if (parentId) {
                    loadComments(parentId);
                } else {
                    fetchPosts();
                }
            } catch (err) {
                console.error("Error toggling like:", err);
            }
        }

        // ---------------- COMMENTS (POSTS WITH parent_post_id) ----------------

        function toggleCommentsSection(postId) {
            const section = document.getElementById(`comments-${postId}`);
            const isOpen = section.classList.contains('open');

            if (isOpen) {
                section.classList.remove('open');
            } else {
                section.classList.add('open');
                loadComments(postId);
            }
        }

        async function loadComments(postId) {
            const container = document.getElementById(`comments-list-${postId}`);
            const startedAt = performance.now();
            console.debug('[replies] loading', { parentPostId: postId });
            try {
                const res = await fetch(`${API_BASE}/posts?parentPostId=${postId}`, {
                    headers: getAuthHeaders()
                });
                const responseText = await res.text();
                console.debug('[replies] load response', {
                    parentPostId: postId,
                    status: res.status,
                    durationMs: Math.round(performance.now() - startedAt),
                    body: responseText.slice(0, 500)
                });
                if (!res.ok) throw new Error(`HTTP ${res.status}: ${responseText}`);
                const comments = responseText ? JSON.parse(responseText) : [];

                container.innerHTML = '';
                if (!comments || comments.length === 0) {
                    container.innerHTML = `<div style="font-size:12px; color:var(--text-muted); padding:6px 0;">No replies yet.</div>`;
                    return;
                }

                comments.forEach(c => {
                    const isAuthor = currentUser && currentUser.id === c.user_id;
                    const rawContentEscapedForAttr = c.content.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;');

                    const div = document.createElement('div');
                    div.className = 'comment-item';
                    div.innerHTML = `
                        <div class="thread-header" style="font-size: 13px;">
                            <span class="author">@${escapeHtml(c.user_name || 'user_' + c.user_id)}</span>
                            ${isAuthor ? `
                                <div class="actions-menu">
                                    <button class="action-text-btn" onclick="editComment(${c.id}, '${rawContentEscapedForAttr}', ${postId})">Edit</button>
                                    <button class="action-text-btn" style="color:var(--danger);" onclick="deletePost(${c.id}, ${postId})">Delete</button>
                                </div>
                            ` : ''}
                        </div>
                        <div style="font-size: 13.5px; margin: 4px 0 8px 0; color: #ddd; word-break: break-word;">
                            ${escapeHtml(c.content)}
                        </div>
                        <div class="thread-footer">
                            <button class="icon-btn ${c.is_liked ? 'liked' : ''}" style="font-size:12px;" onclick="toggleLike(${c.id}, ${c.is_liked}, ${postId})">
                                ${c.is_liked ? '❤️' : '🤍'} <span>${c.like_count || 0}</span>
                            </button>
                        </div>
                    `;
                    container.appendChild(div);
                });
            } catch (err) {
                console.error("Error loading comments:", err);
                container.innerHTML = `<div style="font-size:12px; color:var(--danger);">Error loading replies.</div>`;
            }
        }

        async function createComment(parentPostId) {
            if (!token) return alert("Please log in to reply.");
            const input = document.getElementById(`comment-input-${parentPostId}`);
            const content = input.value.trim();

            if (!content) return alert("Reply cannot be empty.");

            const startedAt = performance.now();
            console.debug('[replies] sending', { parentPostId, contentLength: content.length });
            try {
                const res = await fetch(`${API_BASE}/posts`, {
                    method: 'POST',
                    headers: getAuthHeaders(),
                    body: JSON.stringify({
                        content: content,
                        parent_post_id: parentPostId
                    })
                });

                const responseText = await res.text();
                console.debug('[replies] send response', {
                    parentPostId,
                    status: res.status,
                    durationMs: Math.round(performance.now() - startedAt),
                    body: responseText.slice(0, 500)
                });
                if (!res.ok) throw new Error(`HTTP ${res.status}: ${responseText}`);

                input.value = '';
                await loadComments(parentPostId);
            } catch (err) {
                console.error("Error replying:", err);
                alert("Failed to send reply: " + err.message);
            }
        }

        async function editComment(id, currentContent, parentPostId) {
            if (!token) return alert("Please log in to edit.");
            const newContent = prompt("Update your reply:", currentContent);
            if (newContent === null || !newContent.trim()) return;

            try {
                const res = await fetch(`${API_BASE}/posts`, {
                    method: 'PUT',
                    headers: getAuthHeaders(),
                    body: JSON.stringify({ id: id, content: newContent.trim() })
                });

                if (!res.ok) throw new Error(await res.text());
                loadComments(parentPostId);
            } catch (err) {
                console.error("Error updating reply:", err);
                alert("Failed to update reply: " + err.message);
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
